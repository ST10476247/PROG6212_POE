<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background-color: #0F172A; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="card-users" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Title & Header Banner -->
  <rect x="50" y="30" width="1300" height="85" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="50" y="30" width="8" height="85" rx="4" fill="url(#grad-title)"/>
  <text x="80" y="68" fill="#F8FAFC" font-size="26" font-weight="800" letter-spacing="0.5">RaceDay - Entity-Relationship Diagram (ERD)</text>
  <text x="80" y="96" fill="#94A3B8" font-size="14" font-weight="500">South African Event Management System • Full Relational Data Model (7 Entities)</text>

  <!-- Legend Box -->
  <g transform="translate(1000, 42)">
    <rect width="330" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="22" r="6" fill="#F59E0B"/>
    <text x="34" y="26" fill="#F8FAFC" font-size="12" font-weight="600">[PK] Primary Key</text>
    <circle cx="170" cy="22" r="6" fill="#38BDF8"/>
    <text x="184" y="26" fill="#F8FAFC" font-size="12" font-weight="600">[FK] Foreign Key</text>
    <circle cx="20" cy="44" r="6" fill="#10B981"/>
    <text x="34" y="48" fill="#94A3B8" font-size="12">1 : N (One-to-Many)</text>
    <circle cx="170" cy="44" r="6" fill="#A855F7"/>
    <text x="184" y="48" fill="#94A3B8" font-size="12">1 : 0..1 (Optional 1:1)</text>
  </g>

  <!-- ==================== ROW 1 ==================== -->

  <!-- ENTITY 1: USERS -->
  <g filter="url(#glow)" transform="translate(50, 150)">
    <rect width="280" height="250" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#3B82F6"/>
    <rect y="30" width="280" height="12" fill="#3B82F6"/>
    <text x="140" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">USERS</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK UserID</text><text x="180" y="66" fill="#94A3B8" font-size="12">: INT [Identity]</text>
    <text x="20" y="92" fill="#F8FAFC" font-size="13">Email</text><text x="180" y="92" fill="#94A3B8" font-size="12">: NVARCHAR (UQ)</text>
    <text x="20" y="118" fill="#F8FAFC" font-size="13">PasswordHash</text><text x="180" y="118" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">Role</text><text x="180" y="144" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">CreatedAt</text><text x="180" y="170" fill="#94A3B8" font-size="12">: DATETIME2</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">IsActive</text><text x="180" y="196" fill="#94A3B8" font-size="12">: BIT</text>
  </g>

  <!-- ENTITY 2: ORGANISERS -->
  <g filter="url(#glow)" transform="translate(390, 150)">
    <rect width="290" height="270" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="290" height="42" rx="12" fill="#6366F1"/>
    <rect y="30" width="290" height="12" fill="#6366F1"/>
    <text x="145" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">ORGANISERS</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK OrganiserID</text><text x="190" y="66" fill="#94A3B8" font-size="12">: INT [Identity]</text>
    <text x="20" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK UserID</text><text x="190" y="92" fill="#94A3B8" font-size="12">: INT (UQ)</text>
    <text x="20" y="118" fill="#F8FAFC" font-size="13">OrganizationName</text><text x="190" y="118" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">ContactEmail</text><text x="190" y="144" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">Phone</text><text x="190" y="170" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">Province</text><text x="190" y="196" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="222" fill="#F8FAFC" font-size="13">IsVerified</text><text x="190" y="222" fill="#94A3B8" font-size="12">: BIT</text>
    <text x="20" y="248" fill="#F8FAFC" font-size="13">CreatedAt</text><text x="190" y="248" fill="#94A3B8" font-size="12">: DATETIME2</text>
  </g>

  <!-- ENTITY 4: EVENTS -->
  <g filter="url(#glow)" transform="translate(740, 150)">
    <rect width="310" height="340" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="310" height="42" rx="12" fill="#0EA5E9"/>
    <rect y="30" width="310" height="12" fill="#0EA5E9"/>
    <text x="155" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">EVENTS</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK EventID</text><text x="200" y="66" fill="#94A3B8" font-size="12">: INT [Identity]</text>
    <text x="20" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK OrganiserID</text><text x="200" y="92" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="118" fill="#F8FAFC" font-size="13">EventName</text><text x="200" y="118" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">EventType</text><text x="200" y="144" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">EventDate</text><text x="200" y="170" fill="#94A3B8" font-size="12">: DATETIME2</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">Location</text><text x="200" y="196" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="222" fill="#F8FAFC" font-size="13">Province</text><text x="200" y="222" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="248" fill="#F8FAFC" font-size="13">Description</text><text x="200" y="248" fill="#94A3B8" font-size="12">: NVARCHAR(MAX)</text>
    <text x="20" y="274" fill="#F8FAFC" font-size="13">Status</text><text x="200" y="274" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="300" fill="#F8FAFC" font-size="13">ElevationGainMeters</text><text x="200" y="300" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="324" fill="#F8FAFC" font-size="13">TerrainType</text><text x="200" y="324" fill="#94A3B8" font-size="12">: NVARCHAR</text>
  </g>

  <!-- ENTITY 5: CATEGORIES -->
  <g filter="url(#glow)" transform="translate(1110, 150)">
    <rect width="240" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="240" height="42" rx="12" fill="#10B981"/>
    <rect y="30" width="240" height="12" fill="#10B981"/>
    <text x="120" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">CATEGORIES</text>
    
    <text x="18" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK CategoryID</text><text x="150" y="66" fill="#94A3B8" font-size="12">: INT [ID]</text>
    <text x="18" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK EventID</text><text x="150" y="92" fill="#94A3B8" font-size="12">: INT</text>
    <text x="18" y="118" fill="#F8FAFC" font-size="13">CategoryName</text><text x="150" y="118" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="18" y="144" fill="#F8FAFC" font-size="13">DistanceKm</text><text x="150" y="144" fill="#94A3B8" font-size="12">: DECIMAL</text>
    <text x="18" y="170" fill="#F8FAFC" font-size="13">EntryFeeZAR</text><text x="150" y="170" fill="#94A3B8" font-size="12">: DECIMAL</text>
    <text x="18" y="196" fill="#F8FAFC" font-size="13">MaxCapacity</text><text x="150" y="196" fill="#94A3B8" font-size="12">: INT</text>
    <text x="18" y="222" fill="#F8FAFC" font-size="13">StartTime</text><text x="150" y="222" fill="#94A3B8" font-size="12">: TIME</text>
    <text x="18" y="248" fill="#F8FAFC" font-size="13">CutoffHours</text><text x="150" y="248" fill="#94A3B8" font-size="12">: DECIMAL</text>
  </g>

  <!-- ==================== ROW 2 ==================== -->

  <!-- ENTITY 3: PARTICIPANTS -->
  <g filter="url(#glow)" transform="translate(50, 560)">
    <rect width="280" height="320" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#F59E0B"/>
    <rect y="30" width="280" height="12" fill="#F59E0B"/>
    <text x="140" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">PARTICIPANTS</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK ParticipantID</text><text x="180" y="66" fill="#94A3B8" font-size="12">: INT [ID]</text>
    <text x="20" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK UserID</text><text x="180" y="92" fill="#94A3B8" font-size="12">: INT (UQ)</text>
    <text x="20" y="118" fill="#F8FAFC" font-size="13">FirstName</text><text x="180" y="118" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">LastName</text><text x="180" y="144" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">SAIDOrPassport</text><text x="180" y="170" fill="#94A3B8" font-size="12">: NVARCHAR (UQ)</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">Gender</text><text x="180" y="196" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="222" fill="#F8FAFC" font-size="13">DateOfBirth</text><text x="180" y="222" fill="#94A3B8" font-size="12">: DATE</text>
    <text x="20" y="248" fill="#F8FAFC" font-size="13">ClubName</text><text x="180" y="248" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="274" fill="#F8FAFC" font-size="13">EmergencyPhone</text><text x="180" y="274" fill="#94A3B8" font-size="12">: NVARCHAR</text>
    <text x="20" y="300" fill="#F8FAFC" font-size="13">Email</text><text x="180" y="300" fill="#94A3B8" font-size="12">: NVARCHAR</text>
  </g>

  <!-- ENTITY 6: ENTRIES (Associative Entity) -->
  <g filter="url(#glow)" transform="translate(520, 560)">
    <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#8B5CF6"/>
    <rect y="30" width="320" height="12" fill="#8B5CF6"/>
    <text x="160" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">ENTRIES (Enrolments)</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK EntryID</text><text x="200" y="66" fill="#94A3B8" font-size="12">: INT [Identity]</text>
    <text x="20" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK ParticipantID</text><text x="200" y="92" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="118" fill="#38BDF8" font-size="13" font-weight="700">FK CategoryID</text><text x="200" y="118" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">BibNumber</text><text x="200" y="144" fill="#94A3B8" font-size="12">: NVARCHAR (UQ)</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">RegistrationDate</text><text x="200" y="170" fill="#94A3B8" font-size="12">: DATETIME2</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">PaymentStatus</text><text x="200" y="196" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="222" fill="#F8FAFC" font-size="13">PaymentReference</text><text x="200" y="222" fill="#94A3B8" font-size="12">: NVARCHAR (UQ)</text>
    <text x="20" y="248" fill="#F8FAFC" font-size="13">MedicalNotes</text><text x="200" y="248" fill="#94A3B8" font-size="12">: NVARCHAR</text>
  </g>

  <!-- ENTITY 7: RESULTS -->
  <g filter="url(#glow)" transform="translate(1000, 560)">
    <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#EC4899"/>
    <rect y="30" width="320" height="12" fill="#EC4899"/>
    <text x="160" y="27" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">RESULTS</text>
    
    <text x="20" y="66" fill="#F59E0B" font-size="13" font-weight="700">PK ResultID</text><text x="200" y="66" fill="#94A3B8" font-size="12">: INT [Identity]</text>
    <text x="20" y="92" fill="#38BDF8" font-size="13" font-weight="700">FK EntryID</text><text x="200" y="92" fill="#94A3B8" font-size="12">: INT (UQ)</text>
    <text x="20" y="118" fill="#F8FAFC" font-size="13">GunTime</text><text x="200" y="118" fill="#94A3B8" font-size="12">: TIME(3)</text>
    <text x="20" y="144" fill="#F8FAFC" font-size="13">ChipTime</text><text x="200" y="144" fill="#94A3B8" font-size="12">: TIME(3)</text>
    <text x="20" y="170" fill="#F8FAFC" font-size="13">OverallRank</text><text x="200" y="170" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="196" fill="#F8FAFC" font-size="13">CategoryRank</text><text x="200" y="196" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="222" fill="#F8FAFC" font-size="13">GenderRank</text><text x="200" y="222" fill="#94A3B8" font-size="12">: INT</text>
    <text x="20" y="248" fill="#F8FAFC" font-size="13">Status</text><text x="200" y="248" fill="#94A3B8" font-size="12">: NVARCHAR (CK)</text>
    <text x="20" y="274" fill="#F8FAFC" font-size="13">RecordedAt</text><text x="200" y="274" fill="#94A3B8" font-size="12">: DATETIME2</text>
  </g>

  <!-- ==================== RELATIONSHIP CONNECTORS ==================== -->

  <!-- R1: USERS (1) -> (0..1) ORGANISERS -->
  <path d="M 330 240 L 390 240" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="340" y="220" width="40" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="360" y="233" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">1:1</text>

  <!-- R2: USERS (1) -> (0..1) PARTICIPANTS -->
  <path d="M 190 400 L 190 560" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="170" y="470" width="40" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="190" y="483" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">1:1</text>

  <!-- R3: ORGANISERS (1) -> (N) EVENTS -->
  <path d="M 680 270 L 740 270" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="692" y="250" width="36" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="710" y="263" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- R4: EVENTS (1) -> (N) CATEGORIES -->
  <path d="M 1050 270 L 1110 270" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1062" y="250" width="36" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="1080" y="263" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- R5: PARTICIPANTS (1) -> (N) ENTRIES -->
  <path d="M 330 700 L 520 700" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="410" y="682" width="36" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="428" y="695" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle">1:N</text>

  <!-- R6: CATEGORIES (1) -> (N) ENTRIES -->
  <path d="M 1230 450 L 1230 510 L 680 510 L 680 560" stroke="#38BDF8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="940" y="498" width="50" height="20" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="965" y="512" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">1:N Cat</text>

  <!-- R7: ENTRIES (1) -> (0..1) RESULTS -->
  <path d="M 840 700 L 1000 700" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="900" y="682" width="45" height="18" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
  <text x="922" y="695" fill="#EC4899" font-size="10" font-weight="700" text-anchor="middle">1:0..1</text>

</svg>
